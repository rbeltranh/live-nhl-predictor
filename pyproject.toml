[project]
name = "live-nhl-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rafael Beltran", email = "rafaelbeltran@habi.co" }
]
requires-python = ">=3.14"
dependencies = [
    "fastparquet>=2026.9.0",
    "nhl-api-py>=3.3.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
live-nhl-predictor = "live_nhl_predictor:main"
nhl-ingest = "data_ingestion.download_data:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["live_nhl_predictor", "data_ingestion"]
source-exclude = ["**/data_downloads/**"]
wheel-exclude = ["**/data_downloads/**"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
